<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虫ペット 〜カブト・クワガタ育成記〜</title>
<style>
  :root{
    --bg-dark:#1c2a1a;
    --panel:#2f4327;
    --panel-light:#3d5732;
    --wood:#6b4a2b;
    --wood-dark:#4a3119;
    --cream:#f5ecd0;
    --accent:#e8b23d;
    --accent2:#7bc96f;
    --danger:#d9534f;
    --text:#f5ecd0;
    --sub:#c9d9b8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse at top,#2d4025,#141f11 70%);
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:16px;
  }
  #phone{
    width:100%;
    max-width:460px;
    background:linear-gradient(180deg,var(--wood),var(--wood-dark));
    border-radius:28px;
    padding:14px;
    box-shadow:0 12px 40px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,255,255,0.05);
  }
  #screen{
    background:linear-gradient(180deg,var(--panel),#25351f);
    border-radius:18px;
    padding:14px;
    min-height:560px;
    box-shadow:inset 0 2px 12px rgba(0,0,0,0.5);
    position:relative;
    overflow:hidden;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    padding:6px 10px;
    background:rgba(0,0,0,0.25);
    border-radius:12px;
  }
  header .title{
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
  }
  header .currency{
    font-size:14px;
    font-weight:bold;
    color:var(--accent);
    display:flex;
    align-items:center;
    gap:5px;
  }
  header .currency img{width:20px;height:20px;object-fit:contain;}
  nav#tabs{
    display:flex;
    gap:6px;
    margin-bottom:10px;
  }
  nav#tabs button{
    flex:1;
    padding:9px 4px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.06);
    color:var(--sub);
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
  }
  nav#tabs button.active{
    background:var(--accent2);
    color:#173a13;
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
  }
  .panel{
    background:rgba(0,0,0,0.2);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
  }
  .hidden{display:none !important;}
  .center{text-align:center;}
  h2{margin:0 0 10px;font-size:15px;color:var(--accent);}
  h3{margin:0 0 6px;font-size:13px;color:var(--sub);}
  p{font-size:12.5px;line-height:1.6;color:var(--sub);margin:4px 0;}
  .bug-stage{
    width:150px;
    height:150px;
    margin:0 auto 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .bug-stage img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,0.5));}
  .bug-stage svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,0.5));}
  .injury-badge{
    position:absolute;bottom:2px;right:2px;width:38px;height:38px;
    object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));
  }
  .pet-name{font-size:17px;font-weight:bold;text-align:center;color:var(--cream);}
  .pet-sub{font-size:11.5px;text-align:center;color:var(--sub);margin-bottom:8px;}
  .meter-row{margin:6px 0;}
  .meter-label{
    display:flex;justify-content:space-between;
    font-size:11px;color:var(--sub);margin-bottom:2px;
  }
  .meter-bg{
    width:100%;height:10px;border-radius:6px;
    background:rgba(0,0,0,0.35);
    overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.5);
  }
  .meter-fill{height:100%;border-radius:6px;transition:width .4s ease;}
  .fill-hunger{background:linear-gradient(90deg,#e8b23d,#f4d374);}
  .fill-stamina{background:linear-gradient(90deg,#4f9ee0,#7cc4f5);}
  .fill-hp{background:linear-gradient(90deg,#7bc96f,#a8e79c);}
  .fill-growth{background:linear-gradient(90deg,#b98af0,#d9b8f7);}
  .stat-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:6px;
    margin-top:8px;font-size:12px;
  }
  .stat-chip{
    background:rgba(255,255,255,0.06);
    border-radius:8px;padding:6px 8px;
    display:flex;justify-content:space-between;
  }
  .stat-chip b{color:var(--accent2);}
  .actions{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;
  }
  .actions.tri{grid-template-columns:1fr 1fr 1fr;}
  button.act{
    padding:11px 6px;
    border:none;border-radius:10px;
    background:linear-gradient(180deg,var(--accent2),#5aa550);
    color:#0f2a0c;font-weight:bold;font-size:12.5px;
    cursor:pointer;
    box-shadow:0 3px 0 #3f7a37;
    transition:.1s;
  }
  button.act:active{transform:translateY(2px);box-shadow:0 1px 0 #3f7a37;}
  button.act:disabled{
    background:#4a4a4a;color:#8a8a8a;box-shadow:0 3px 0 #2c2c2c;cursor:not-allowed;
  }
  button.act.blue{background:linear-gradient(180deg,#5aa0e6,#3672b8);color:#eef6ff;box-shadow:0 3px 0 #244d80;}
  button.act.gold{background:linear-gradient(180deg,var(--accent),#c98f22);color:#3a2400;box-shadow:0 3px 0 #8a6316;}
  button.small{padding:6px 8px;font-size:11px;border-radius:8px;}
  .btn-icon{width:15px;height:15px;object-fit:contain;vertical-align:-3px;margin-right:2px;}
  .cooldown{font-size:9.5px;opacity:.85;display:block;margin-top:2px;}
  .warn{
    background:rgba(217,83,79,0.25);
    border:1px solid rgba(217,83,79,0.6);
    border-radius:8px;padding:6px 8px;font-size:11.5px;margin-top:8px;color:#ffd6d4;
  }
  .egg-choice{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;
  }
  .egg-card{
    background:rgba(255,255,255,0.06);
    border-radius:12px;padding:10px;text-align:center;
    cursor:pointer;border:2px solid transparent;
    transition:.15s;
  }
  .egg-card:hover{border-color:var(--accent2);}
  .egg-card img{width:70px;height:70px;object-fit:contain;}
  .egg-card .fam-name{font-weight:bold;font-size:13px;margin-top:4px;}
  .badge{
    display:inline-block;padding:2px 8px;border-radius:20px;
    font-size:10px;font-weight:bold;margin-left:4px;
  }
  .badge.common{background:#7a7a7a;color:#fff;}
  .badge.uncommon{background:#4a8f52;color:#fff;}
  .badge.rare{background:#3f6fd1;color:#fff;}
  .badge.superrare{background:linear-gradient(90deg,#e6789f,#e8b23d,#5aa0e6);color:#fff;}
  .dex-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .dex-card{
    background:rgba(255,255,255,0.06);border-radius:10px;padding:8px;text-align:center;
    opacity:.35;
  }
  .dex-card.found{opacity:1;}
  .dex-card img{width:56px;height:56px;object-fit:contain;}
  .dex-card .dname{font-size:11px;font-weight:bold;margin-top:2px;}
  .dex-card .ddesc{font-size:9.5px;color:var(--sub);margin-top:2px;height:28px;overflow:hidden;}
  .battle-vs{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .battle-side{flex:1;text-align:center;}
  .battle-side img{width:80px;height:80px;object-fit:contain;}
  .vs-text{font-size:18px;font-weight:bold;color:var(--accent);}
  #battleLog{
    background:rgba(0,0,0,0.35);border-radius:10px;padding:8px;
    height:120px;overflow-y:auto;font-size:11.5px;margin-top:10px;
    display:flex;flex-direction:column-reverse;
  }
  #battleLog div{padding:2px 0;border-bottom:1px dashed rgba(255,255,255,0.08);}
  .diff-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .diff-item{
    display:flex;justify-content:space-between;align-items:center;
    background:rgba(255,255,255,0.06);border-radius:10px;padding:8px 10px;
  }
  .diff-item .dname{font-weight:bold;font-size:13px;}
  .diff-item .dreward{font-size:11px;color:var(--accent);}
  .history-item{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,0.05);border-radius:10px;padding:6px 8px;margin-bottom:6px;
  }
  .history-item img{width:34px;height:34px;object-fit:contain;flex-shrink:0;}
  .history-item .hname{font-size:12px;font-weight:bold;}
  .history-item .hstat{font-size:10px;color:var(--sub);}
  footer{margin-top:10px;text-align:center;}
  footer button{
    background:rgba(217,83,79,0.15);
    border:1px solid rgba(217,83,79,0.45);
    color:#ffb3b0;font-size:12px;font-weight:bold;
    padding:9px 16px;border-radius:10px;cursor:pointer;
  }
  .confirm-actions{display:flex;gap:10px;justify-content:center;margin-top:14px;}
  button.act.danger{background:linear-gradient(180deg,#e0605a,#b83a34);color:#fff;box-shadow:0 3px 0 #7a231f;}
  #modalOverlay{
    position:absolute;inset:0;background:rgba(0,0,0,0.7);
    display:flex;align-items:center;justify-content:center;
    border-radius:18px;z-index:50;
  }
  #modalBox{
    background:linear-gradient(180deg,var(--panel-light),var(--panel));
    border-radius:14px;padding:18px;width:85%;text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,0.6);
  }
  #modalBox img{width:110px;height:110px;object-fit:contain;margin:0 auto;display:block;}
  #modalBox svg{width:110px;height:110px;margin:0 auto;display:block;}
  #modalBox h2{font-size:16px;}
  .awaken-text{
    display:block;font-size:40px;font-weight:900;letter-spacing:4px;
    color:var(--accent);
    text-shadow:0 0 12px rgba(232,178,61,0.85), 0 0 24px rgba(232,178,61,0.5);
    margin-bottom:6px;
  }
  #modalBox button{
    margin-top:12px;padding:10px 20px;border:none;border-radius:10px;
    background:var(--accent2);color:#173a13;font-weight:bold;cursor:pointer;
  }
  input.nameInput{
    width:100%;padding:8px;border-radius:8px;border:none;
    font-size:13px;text-align:center;margin-top:8px;background:#fff;color:#222;
  }
</style>
</head>
<body>
<div id="phone">
  <div id="screen">
    <header>
      <div class="title">🌳 虫ペット</div>
      <div class="currency"><img src="images/donguri.png" alt="どんぐり"> <span id="currencyVal">0</span></div>
    </header>
    <nav id="tabs">
      <button data-tab="raise" class="active">育成</button>
      <button data-tab="battle">対戦</button>
      <button data-tab="dex">図鑑</button>
    </nav>

    <div id="tab-raise"></div>
    <div id="tab-battle" class="hidden"></div>
    <div id="tab-dex" class="hidden"></div>

    <footer>
      <button id="resetBtn">セーブデータをリセット</button>
    </footer>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============ CONFIG ============ */

const SPECIES = {
  kabuto: [
    {id:'kabuto_cha',  name:'カブトムシ',           tier:'common',    img:'images/kabuto_uncommon.png',  base:{power:40,speed:30,technique:25,vitality:90},  desc:'夏に大人気の定番カブトムシ。艶やかな体を持つ。'},
    {id:'kabuto_kuro', name:'ゴホンヅノカブト',     tier:'uncommon',  img:'images/kabuto_rare.png',       base:{power:60,speed:35,technique:30,vitality:110}, desc:'5本の角を持つ珍しいカブトムシ。'},
    {id:'gohonduno',   name:'コーカサスオオカブト', tier:'rare',      img:'images/kabuto_caucasus.png',   base:{power:75,speed:45,technique:38,vitality:105}, desc:'3本の長い角を持つ、世界最大級のカブトムシの一種。'},
    {id:'hercules',    name:'ヘラクレスオオカブト', tier:'superrare', img:'images/kabuto_superrare.png',  base:{power:95,speed:42,technique:50,vitality:140}, desc:'世界最大級、伝説のカブトムシ。'}
  ],
  kuwa: [
    {id:'kuwa_normal', name:'ノコギリクワガタ',     tier:'common',    img:'images/kuwa_common.png',       base:{power:35,speed:45,technique:30,vitality:80},  desc:'大きく湾曲した顎が特徴のクワガタ。'},
    {id:'primosi',     name:'オオクワガタ',         tier:'uncommon',  img:'images/kuwa_ohkuwa.png',       base:{power:50,speed:55,technique:35,vitality:90},  desc:'クワガタの王様と呼ばれる憧れの存在。'},
    {id:'nijiiro',     name:'ニジイロクワガタ',     tier:'rare',      img:'images/kuwa_superrare.png',    base:{power:58,speed:52,technique:58,vitality:100}, desc:'虹色に輝く美しい体を持つ幻のクワガタ。'},
    {id:'ougononi',    name:'オウゴンオニクワガタ', tier:'superrare', img:'images/kuwa_rare.png',         base:{power:62,speed:68,technique:62,vitality:95},  desc:'金色に輝く体を持つ珍しい鬼クワガタ。'}
  ]
};
const TIER_LABEL = {common:'ノーマル',uncommon:'アンコモン',rare:'レア',superrare:'超レア'};
// The adult species is a weighted random roll, not a hard cutoff: care QUALITY
// (0-100, changed only by discrete events -- injuries, the rare awakening
// event -- never by elapsed time) skews the roll toward rarer tiers without
// ever making any tier fully guaranteed or fully impossible.
const TIER_ROLL_CUTOFFS = [
  {name:'common',    max:0.55},
  {name:'uncommon',  max:0.85},
  {name:'rare',      max:0.98},
  {name:'superrare', max:1.01}
];
const TIER_QUALITY_SKEW = 4;

function rollTier(quality){
  const s = clamp(quality,0,100)/100;
  const p = 1/(1 + TIER_QUALITY_SKEW*s);
  const rAdj = Math.pow(Math.random(), p);
  for(const t of TIER_ROLL_CUTOFFS){ if(rAdj < t.max) return t.name; }
  return 'superrare';
}

const FAMILY_LABEL = {kabuto:'カブトムシ系', kuwa:'クワガタ系'};

const IMG = {
  larva: 'images/larva.png',
  food: 'images/food.png',
  bandage: 'images/bandage.png',
  death: 'images/death_star.png',
  donguri: 'images/donguri.png'
};

const STAGE_THRESHOLDS = [100,150,200]; // larva1->2, 2->3, 3->pupa
const PUPA_DURATION_MS = 60*1000;

const COOLDOWN = { feed:6000, train:10000, rest:15000 };
const DECAY = { hungerPerSec: 1/60, staminaRegenPerSec: 1/45 };

const MIN_TRAIN_STAMINA = 5;
const INJURY_DURATION_MS = 45000;
const INJURY_STAT_PENALTY = 3;

const AWAKENING_CHANCE = 0.1;

// 育成度 (0-100) is the trained power+speed+technique total, scaled against the
// highest sum a larva can realistically end adulthood with. Verified by
// simulating several playstyles (no training: 0, casual mixed: ~25-40, deliberate
// balanced training: ~80, all-in training that never feeds: ~185-190) --
// 185 keeps that whole spread meaningful across 0-100 instead of everyone
// clustering near the top.
const IKUSEIDO_STAT_MAX = 185;
const INJURY_IKUSEIDO_PENALTY = Math.round(IKUSEIDO_STAT_MAX * 0.25);
const AWAKENING_IKUSEIDO_BONUS = Math.round(IKUSEIDO_STAT_MAX * 0.20);

function injuryChance(stamina){
  // 0% at stamina 60+, ramps up to 45% as stamina approaches 0
  return clamp((60-stamina)/60, 0, 1) * 0.45;
}
function deathChance(stamina){
  // only possible once stamina is critically low (<=15), and even then stays rare (max ~4%)
  if(stamina > 15) return 0;
  return clamp((15-stamina)/15, 0, 1) * 0.04;
}

const CURRENCY_REGEN_MS = 45000; // +1 どんぐり per interval
const CURRENCY_REGEN_OFFLINE_CAP_MS = 6*60*60*1000; // cap offline catch-up at 6 hours worth
const MAX_CURRENCY = 300;

const DIFFICULTIES = [
  {id:'easy',   name:'初級',  mult:0.75, reward:20},
  {id:'normal', name:'中級',  mult:1.0,  reward:40},
  {id:'hard',   name:'上級',  mult:1.25, reward:70},
  {id:'legend', name:'伝説',  mult:1.55, reward:130, requireWins:5}
];

const RIVAL_ADJ = ['野生の','森の','山奥の','伝説の','放浪の','古参の','闘志溢れる','静かなる'];

const SAVE_KEY = 'mushiPetSave_v2';

/* ============ STATE ============ */

function defaultState(){
  return {
    currency: 0,
    eggsHatched: 0,
    wins: 0,
    losses: 0,
    pet: null,
    history: [],
    graveyard: [],
    dex: {},
    lastUpdate: Date.now(),
    lastCurrencyTime: Date.now()
  };
}
let state = load();

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    return Object.assign(defaultState(), s);
  }catch(e){ return defaultState(); }
}
function save(){
  state.lastUpdate = Date.now();
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

function findSpecies(id){
  for(const fam of ['kabuto','kuwa']){
    const f = SPECIES[fam].find(s=>s.id===id);
    if(f) return f;
  }
  return null;
}

/* ============ ART HELPERS (irasutoya illustrations) ============ */

function imgTag(src, alt){
  return `<img src="${src}" alt="${escapeHtml(alt||'')}">`;
}

function eggSVG(){
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="58" rx="24" ry="30" fill="#f7ecd2" stroke="#c9a86a" stroke-width="2"/>
    <ellipse cx="41" cy="42" rx="7" ry="10" fill="#ffffff" opacity="0.55"/>
  </svg>`;
}

function pupaSVG(){
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="55" rx="20" ry="32" fill="#caa876" stroke="#9c7a4a" stroke-width="2"/>
    <path d="M35,35 q15,-10 30,0" fill="none" stroke="#9c7a4a" stroke-width="2" opacity="0.6"/>
    <path d="M32,50 q18,-8 36,0" fill="none" stroke="#9c7a4a" stroke-width="2" opacity="0.5"/>
    <path d="M34,65 q16,-8 32,0" fill="none" stroke="#9c7a4a" stroke-width="2" opacity="0.5"/>
    <path d="M44,22 q6,-10 12,0" fill="none" stroke="#7a5c34" stroke-width="3" opacity="0.7"/>
  </svg>`;
}

function bugImageForPet(pet){
  if(pet.stage==='egg') return eggSVG();
  if(pet.stage==='larva') return imgTag(IMG.larva,'幼虫');
  if(pet.stage==='pupa') return pupaSVG();
  const sp = findSpecies(pet.speciesId);
  return imgTag(sp.img, sp.name);
}

function bugImageForSpecies(sp){
  return imgTag(sp.img, sp.name);
}

function eggChoiceImage(family){
  const sp = SPECIES[family].find(s=>s.tier==='common');
  return imgTag(sp.img, sp.name);
}

function bugStageMarkup(pet){
  const injured = pet.stage==='larva' && pet.injured && Date.now() < pet.injuredUntil;
  return `<div class="bug-stage">${bugImageForPet(pet)}${injured ? `<img class="injury-badge" src="${IMG.bandage}" alt="けが">` : ''}</div>`;
}

/* ============ TIME / DECAY LOGIC ============ */

function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

function applyElapsed(pet, ms){
  const sec = ms/1000;
  if(sec<=0) return;
  pet.hunger = clamp(pet.hunger - DECAY.hungerPerSec*sec, 0, 100);
  pet.stamina = clamp(pet.stamina + DECAY.staminaRegenPerSec*sec, 0, 100);
}

// 育成度 is derived from trained power+speed+technique (so it only ever moves
// when those do -- training, injury, the awakening event -- never drifts with
// elapsed real time), then skews the random species roll at eclosion. See rollTier().
function ikuseido(pet){
  const sum = pet.trained.power + pet.trained.speed + pet.trained.technique + (pet.ikuseiBonus||0);
  return clamp(Math.round(sum / IKUSEIDO_STAT_MAX * 100), 0, 100);
}

function applyInjuryIkuseidoPenalty(pet){
  pet.ikuseiBonus = (pet.ikuseiBonus||0) - INJURY_IKUSEIDO_PENALTY;
}

function updateInjuryStatus(pet){
  if(pet && pet.injured && Date.now() >= pet.injuredUntil){
    pet.injured = false;
  }
}

function regenCurrency(){
  const now = Date.now();
  if(!state.lastCurrencyTime) state.lastCurrencyTime = now;
  let elapsed = now - state.lastCurrencyTime;
  if(elapsed > CURRENCY_REGEN_OFFLINE_CAP_MS){
    state.lastCurrencyTime = now - CURRENCY_REGEN_OFFLINE_CAP_MS;
    elapsed = CURRENCY_REGEN_OFFLINE_CAP_MS;
  }
  const intervals = Math.floor(elapsed / CURRENCY_REGEN_MS);
  if(intervals > 0){
    state.currency = clamp(state.currency + intervals, 0, MAX_CURRENCY);
    state.lastCurrencyTime += intervals * CURRENCY_REGEN_MS;
  }
}

function catchUpOffline(){
  regenCurrency();
  if(!state.pet) return;
  const now = Date.now();
  const elapsed = now - state.lastUpdate;
  const pet = state.pet;
  updateInjuryStatus(pet);
  if(pet.stage==='pupa'){
    const remain = pet.pupaEndAt - state.lastUpdate;
    if(elapsed >= remain){
      finishPupa();
    }
  } else if(pet.stage==='larva' || pet.stage==='egg'){
    applyElapsed(pet, Math.min(elapsed, 1000*60*60*24*3)); // cap 3 days worth
  }
}

/* ============ CORE ACTIONS ============ */

function newEggCost(){
  if(state.eggsHatched===0) return 0;
  return 100;
}

function hatchEgg(family){
  const cost = newEggCost();
  if(state.currency < cost){
    alert(`どんぐりが足りません。（必要: ${cost} / 所持: ${state.currency}）`);
    return;
  }
  state.currency -= cost;
  state.eggsHatched += 1;
  state.pet = {
    family: family,
    name: family==='kabuto' ? 'カブトくん' : 'クワガタくん',
    stage: 'larva',
    larvaLevel: 1,
    growth: 0,
    hunger: 80,
    stamina: 80,
    injured: false,
    injuredUntil: 0,
    ikuseiBonus: 0,
    trained: {power:0, speed:0, technique:0},
    stageStart: Date.now(),
    pupaEndAt: null,
    speciesId: null,
    cooldowns: {feed:0, train:0, rest:0},
    hpNow: null
  };
  save();
  renderAll();
}

function effMultiplier(pet){
  if(pet.hunger<20 || pet.stamina<10) return 0.5;
  return 1.0;
}

function doFeed(){
  const pet = state.pet;
  if(!pet || pet.stage!=='larva') return;
  const now = Date.now();
  if(now < pet.cooldowns.feed) return;
  const eff = effMultiplier(pet);
  pet.hunger = clamp(pet.hunger + 25, 0, 100);
  const gain = 10*eff;
  pet.growth += gain;
  const statBump = Math.round(2*eff);
  const statKeys = ['power','speed','technique'];
  const k = statKeys[Math.floor(Math.random()*3)];
  pet.trained[k] += statBump;
  pet.cooldowns.feed = now + COOLDOWN.feed;
  checkEvolution();
  save(); renderAll();
}

function doTrain(stat){
  const pet = state.pet;
  if(!pet || pet.stage!=='larva') return;
  const now = Date.now();
  if(now < pet.cooldowns.train) return;
  updateInjuryStatus(pet);
  if(pet.injured) return;
  if(pet.stamina < MIN_TRAIN_STAMINA) return;

  pet.cooldowns.train = now + COOLDOWN.train;
  const staminaBefore = pet.stamina;

  // training on fumes can, very rarely, be fatal
  if(staminaBefore <= 15 && Math.random() < deathChance(staminaBefore)){
    pet.stamina = clamp(pet.stamina - 15, 0, 100);
    save();
    dieOfOverwork();
    return;
  }

  const eff = effMultiplier(pet);
  const gotInjured = Math.random() < injuryChance(staminaBefore);
  pet.stamina = clamp(pet.stamina - 15, 0, 100);
  pet.hunger = clamp(pet.hunger - 5, 0, 100);

  if(gotInjured){
    pet.injured = true;
    pet.injuredUntil = now + INJURY_DURATION_MS;
    pet.trained.power = Math.max(0, pet.trained.power - INJURY_STAT_PENALTY);
    pet.trained.speed = Math.max(0, pet.trained.speed - INJURY_STAT_PENALTY);
    pet.trained.technique = Math.max(0, pet.trained.technique - INJURY_STAT_PENALTY);
    applyInjuryIkuseidoPenalty(pet);
    save();
    showEvoModal(`スタミナが少ない状態で無理に鍛えたら…<br><b>けがをしてしまった！</b><br>力・速さ・技が少し下がり、育成度も大きく落ちてしまった…<br>${Math.round(INJURY_DURATION_MS/1000)}秒ほどトレーニングを休むことに…`, imgTag(IMG.bandage,'けが'));
    return;
  }

  const gain = 18*eff;
  pet.growth += gain;
  pet.trained[stat] += Math.round(7*eff);
  checkEvolution();
  save(); renderAll();
}

function doRest(){
  const pet = state.pet;
  if(!pet || pet.stage!=='larva') return;
  const now = Date.now();
  if(now < pet.cooldowns.rest) return;
  pet.stamina = clamp(pet.stamina + 30, 0, 100);
  pet.cooldowns.rest = now + COOLDOWN.rest;
  save(); renderAll();
}

function checkEvolution(){
  const pet = state.pet;
  if(!pet || pet.stage!=='larva') return;
  const threshold = STAGE_THRESHOLDS[pet.larvaLevel-1];
  if(pet.growth >= threshold){
    if(pet.larvaLevel < 3){
      pet.larvaLevel += 1;
      pet.growth = 0;
      pet.stageStart = Date.now();
      showEvoModal(`幼虫が育って<br><b>${pet.larvaLevel}齢幼虫</b>になった！`, imgTag(IMG.larva,'幼虫'));
    } else {
      pet.stage = 'pupa';
      pet.pupaEndAt = Date.now() + PUPA_DURATION_MS;
      if(Math.random() < AWAKENING_CHANCE){
        pet.ikuseiBonus = (pet.ikuseiBonus||0) + AWAKENING_IKUSEIDO_BONUS;
        showEvoModal(`<span class="awaken-text">覚醒</span><br>育成度が20上がりました！`, pupaSVG());
      } else {
        showEvoModal(`さなぎになった…<br>しばらく静かに見守ろう。`, pupaSVG());
      }
    }
  }
}

function finishPupa(){
  const pet = state.pet;
  if(!pet || pet.stage!=='pupa') return;
  const tier = rollTier(ikuseido(pet));
  const list = SPECIES[pet.family];
  const sp = list.find(s=>s.tier===tier) || list[0];
  pet.speciesId = sp.id;
  pet.stage = 'adult';
  pet.stageStart = Date.now();
  pet.hpMax = sp.base.vitality + Math.round(pet.trained.power*0.15);
  pet.hpNow = pet.hpMax;
  state.dex[sp.id] = true;
  save();
  showEvoModal(`せいちゅうになった！<br><b>${sp.name}</b> が誕生！<span class="badge ${sp.tier}">${TIER_LABEL[sp.tier]}</span>`, imgTag(sp.img, sp.name));
}

function finalStats(pet){
  const sp = findSpecies(pet.speciesId);
  return {
    power: sp.base.power + Math.min(30, Math.round(pet.trained.power*0.3)),
    speed: sp.base.speed + Math.min(30, Math.round(pet.trained.speed*0.3)),
    technique: sp.base.technique + Math.min(30, Math.round(pet.trained.technique*0.3)),
    vitality: pet.hpMax
  };
}

function retireAndNewEgg(){
  const pet = state.pet;
  if(pet && pet.stage==='adult'){
    const sp = findSpecies(pet.speciesId);
    state.history.unshift({
      speciesId: pet.speciesId, family: pet.family, name: pet.name,
      stats: finalStats(pet), date: Date.now()
    });
  }
  state.pet = null;
  save();
  renderAll();
}

function dieOfOverwork(){
  const pet = state.pet;
  if(!pet) return;
  state.graveyard.unshift({
    name: pet.name,
    family: pet.family,
    stageLabel: `${pet.larvaLevel}齢幼虫`,
    date: Date.now()
  });
  state.pet = null;
  save();
  showEvoModal(`${escapeHtml(pet.name)}は疲れがたまりすぎて…<br><b>星になってしまった。</b><br>安らかに、いつまでも輝きますように。`, imgTag(IMG.death,'星になった'));
}

  `;

function randRange(a,b){ return a + Math.random()*(b-a); }

function startBattle(diffId){
  if(battleInProgress) return;
  const pet = state.pet;
  const stats = finalStats(pet);
  const diff = DIFFICULTIES.find(d=>d.id===diffId);

  const allSpecies = [...SPECIES.kabuto, ...SPECIES.kuwa];
  const oppSpDef = allSpecies[Math.floor(Math.random()*allSpecies.length)];
  const oppName = RIVAL_ADJ[Math.floor(Math.random()*RIVAL_ADJ.length)] + oppSpDef.name;

  const opp = {
    name: oppName,
    power: Math.round(stats.power * diff.mult * randRange(0.85,1.15)),
    speed: Math.round(stats.speed * diff.mult * randRange(0.85,1.15)),
    technique: Math.round(stats.technique * diff.mult * randRange(0.85,1.15)),
    hpMax: Math.round(stats.vitality * diff.mult * randRange(0.9,1.1))
  };
  opp.hpNow = opp.hpMax;

  let mine = { power:stats.power, speed:stats.speed, technique:stats.technique, hpMax:stats.vitality, hpNow:stats.vitality };

  battleInProgress = true;
  renderBattle();
  const arena = document.getElementById('battleArena');
  arena.classList.remove('hidden');
  document.getElementById('oppImg').innerHTML = bugImageForSpecies(oppSpDef);
  document.getElementById('oppName').textContent = oppName;
  const logEl = document.getElementById('battleLog');
  function log(text){
    const d = document.createElement('div');
    d.textContent = text;
    logEl.prepend(d);
  }
  log(`${opp.name} が現れた！`);

  const mineFirst = mine.speed >= opp.speed;
  let turn = mineFirst ? 'mine' : 'opp';

  const interval = setInterval(()=>{
    if(mine.hpNow<=0 || opp.hpNow<=0){
      clearInterval(interval);
      finishBattle(mine.hpNow>0, diff, pet);
      return;
    }
    if(turn==='mine'){
      const dmg = Math.max(2, Math.round(mine.power - opp.technique*0.4 + randRange(-6,6)));
      opp.hpNow = clamp(opp.hpNow - dmg, 0, opp.hpMax);
      log(`${pet.name} の攻撃！ ${dmg} ダメージ！`);
      turn='opp';
    } else {
      const dmg = Math.max(2, Math.round(opp.power - mine.technique*0.4 + randRange(-6,6)));
      mine.hpNow = clamp(mine.hpNow - dmg, 0, mine.hpMax);
      log(`${opp.name} の攻撃！ ${dmg} ダメージ！`);
      turn='mine';
    }
    document.getElementById('hpMine').style.width = clamp(mine.hpNow/mine.hpMax*100,0,100)+'%';
    document.getElementById('hpOpp').style.width = clamp(opp.hpNow/opp.hpMax*100,0,100)+'%';
    if(mine.hpNow<=0 || opp.hpNow<=0){
      clearInterval(interval);
      setTimeout(()=>finishBattle(mine.hpNow>0, diff, pet), 500);
    }
  }, 850);
}

function finishBattle(won, diff, pet){
  battleInProgress = false;
  if(won){
    state.wins += 1;
    state.currency = clamp(state.currency + diff.reward, 0, MAX_CURRENCY);
    save();
    showEvoModal(`${diff.name}のバトルに<b>勝利！</b><br>どんぐり ${diff.reward} を獲得！`, bugImageForPet(pet));
  } else {
    state.losses += 1;
    state.currency = clamp(state.currency + 5, 0, MAX_CURRENCY);
    save();
    showEvoModal(`${diff.name}のバトルに<b>敗北…</b><br>どんぐり 5 をもらった。また鍛えよう！`, bugImageForPet(pet));
  }
}

/* ============ RENDER: DEX TAB ============ */

function renderDex(){
  const el = document.getElementById('tab-dex');
  const cards = [];
  for(const fam of ['kabuto','kuwa']){
    for(const sp of SPECIES[fam]){
      const found = !!state.dex[sp.id];
      cards.push(`<div class="dex-card ${found?'found':''}">
        ${found ? bugImageForSpecies(sp) : eggSVG()}
        <div class="dname">${found ? sp.name : '？？？'} <span class="badge ${sp.tier}">${TIER_LABEL[sp.tier]}</span></div>
        <div class="ddesc">${found ? sp.desc : 'まだ発見していません'}</div>
      </div>`);
    }
  }
  const total = SPECIES.kabuto.length + SPECIES.kuwa.length;
  const foundCount = Object.keys(state.dex).length;
  el.innerHTML = `
    <div class="panel">
      <h2>図鑑 (${foundCount}/${total})</h2>
      <div class="dex-grid">${cards.join('')}</div>
    </div>
    ${renderHistoryPanel()}${renderGraveyardPanel()}
  `;
}

/* ============ TABS / MAIN RENDER ============ */

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderAll(){
  document.getElementById('currencyVal').textContent = `${state.currency}/${MAX_CURRENCY}`;
  renderRaise();
  if(!battleInProgress) renderBattle();
  renderDex();
}

function setupTabs(){
  const buttons = document.querySelectorAll('#tabs button');
  buttons.forEach(btn=>{
    btn.onclick = ()=>{
      buttons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-raise').classList.toggle('hidden', btn.dataset.tab!=='raise');
      document.getElementById('tab-battle').classList.toggle('hidden', btn.dataset.tab!=='battle');
      document.getElementById('tab-dex').classList.toggle('hidden', btn.dataset.tab!=='dex');
    };
  });
}

document.getElementById('resetBtn').onclick = ()=>{
  showConfirmModal('本当にすべてのセーブデータを削除しますか？<br>この操作は取り消せません。', '削除する', ()=>{
    localStorage.removeItem(SAVE_KEY);
    state = defaultState();
    renderAll();
  }, true);
};

/* ============ TICK LOOP ============ */

setInterval(()=>{
  regenCurrency();
  const pet = state.pet;
  if(pet){
    updateInjuryStatus(pet);
    if(pet.stage==='larva'){
      applyElapsed(pet, 1000);
      checkEvolution();
    } else if(pet.stage==='pupa'){
      if(Date.now() >= pet.pupaEndAt){
        finishPupa();
      }
    }
  }
  save();
  if(!battleInProgress) renderAll();
}, 1000);

/* ============ INIT ============ */

catchUpOffline();
setupTabs();
renderAll();

})();
</script>
</body>
</html>
